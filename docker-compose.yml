services:
  # --- Infrastructure ---
  postgres:
    image: postgres:16-alpine
    container_name: vendora-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vendora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init_databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    networks:
      - vendora_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vendora} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.0
    container_name: vendora-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vendora_orders}
      MYSQL_USER: ${MYSQL_USER:-vendora}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init_databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    networks:
      - vendora_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD:-rootpass} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:7
    container_name: vendora-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-vendora}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-pass}
    volumes:
      - mongo_data:/data/db
    networks:
      - vendora_net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: vendora-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    networks:
      - vendora_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redispass} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: vendora-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vendora}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-pass}
    networks:
      - vendora_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    container_name: vendora-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vendora_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-your-minio-secret}
    volumes:
      - minio_data:/data
    networks:
      - vendora_net

  # --- API Gateway ---
  nginx:
    build: ./infra/nginx
    container_name: vendora-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth:
        condition: service_healthy
      product:
        condition: service_healthy
      order:
        condition: service_healthy
      chat:
        condition: service_healthy
      storage:
        condition: service_healthy
      analytics:
        condition: service_healthy
    networks:
      - vendora_net

  # --- Microservices (Placeholders) ---
  auth:
    build: ./services/auth
    container_name: vendora-auth
    ports:
      - "8081:8081"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vendora_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health | grep -q 'status' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  product:
    build: ./services/product
    container_name: vendora-product
    ports:
      - "8082:8082"
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-base64:change-me-in-development}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${PRODUCT_DB:-vendora_product}
      DB_USERNAME: ${POSTGRES_USER:-vendora}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      AUTH_SERVICE_URL: http://auth:8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
      REDIS_CACHE_DB: 1
      CACHE_DRIVER: redis
      AI_RANKER_URL: http://ai_ranking:8085
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai_ranking:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks:
      - vendora_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health | grep -q 'status' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  order:
    build: ./services/order
    container_name: vendora-order
    ports:
      - "8083:8083"
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - vendora_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health | grep -q 'status' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  chat:
    build: ./services/chat
    container_name: vendora-chat
    ports:
      - "8084:8084"
    env_file: .env
    environment:
      PORT: 8084
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-vendora}
      MONGO_PASS: ${MONGO_PASS:-pass}
      MONGO_DATABASE: ${CHAT_DB:-vendora_chat}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-vendora}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-pass}
      AUTH_SERVICE_URL: http://auth:8081
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - vendora_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health | grep -q 'status' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai_ranking:
    build: ./services/ranking
    container_name: vendora-ai-ranking
    ports:
      - "8085:8085"
    env_file: .env
    environment:
      RANKING_ADMIN_TOKEN: ${RANKING_ADMIN_TOKEN:-change-me-in-development}
      DATA_PATH: /app/data/interactions.csv
      MODEL_PATH: /app/models/model.lgb
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vendora_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  notification:
    build: ./services/notification
    container_name: vendora-notification
    ports:
      - "8086:8086"
    env_file: .env
    environment:
      PORT: 8086
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-vendora}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-pass}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-vendora.events}
      RABBITMQ_NOTIFICATION_QUEUE: ${RABBITMQ_NOTIFICATION_QUEUE:-vendora.notifications}
      NOTIFICATION_MAX_RETRIES: ${NOTIFICATION_MAX_RETRIES:-3}
      NOTIFICATION_RETRY_BASE_DELAY_MS: ${NOTIFICATION_RETRY_BASE_DELAY_MS:-1000}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - vendora_net

  storage:
    build: ./services/storage
    container_name: vendora-storage
    ports:
      - "8087:8087"
    env_file: .env
    depends_on:
      minio:
        condition: service_started
    networks:
      - vendora_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8087/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  analytics:
    build: ./services/analytics
    container_name: vendora-analytics
    ports:
      - "8088:8088"
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${ANALYTICS_DB:-vendora_analytics}
      DB_USERNAME: ${MYSQL_USER:-vendora}
      DB_PASSWORD: ${MYSQL_PASSWORD:-pass}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-vendora}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-pass}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-vendora.events}
      RABBITMQ_ANALYTICS_QUEUE: ${RABBITMQ_ANALYTICS_QUEUE:-vendora.analytics}
      ANALYTICS_MIGRATE_RETRIES: ${ANALYTICS_MIGRATE_RETRIES:-30}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - vendora_net
    healthcheck:
      test: ["CMD", "php", "-r", "if (@file_get_contents('http://localhost:8088/health') === false) exit(1);"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Apps ---
  web:
    build: ./apps/web
    container_name: vendora-web
    ports:
      - "3000:3000"
    env_file: .env
    networks:
      - vendora_net

  admin:
    build: ./apps/admin
    container_name: vendora-admin
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
    env_file: .env
    networks:
      - vendora_net

networks:
  vendora_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  minio_data:
