openapi: 3.0.0
info:
  title: Vendora Chat & Realtime Messaging Service API
  version: 1.0.0
  description: REST conversation history and Socket.IO realtime messaging

servers:
  - url: /api
    description: Nginx Gateway API Route

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Message:
      type: object
      required: [senderId, recipientId, content]
      properties:
        _id: { type: string }
        senderId: { type: integer }
        recipientId: { type: integer }
        content: { type: string, maxLength: 5000 }
        sentAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }

    Conversation:
      type: object
      required: [participantIds, messages]
      properties:
        _id: { type: string }
        participantIds:
          type: array
          minItems: 2
          items: { type: integer }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConversationCreateRequest:
      type: object
      required: [participantIds]
      properties:
        participantIds:
          type: array
          minItems: 2
          items: { type: integer }

    SocketMessageSend:
      type: object
      required: [conversationId, recipientId, content]
      properties:
        conversationId: { type: string }
        recipientId: { type: integer }
        content: { type: string, maxLength: 5000 }

paths:
  /chat/conversations/{userId}:
    get:
      summary: Get conversations for the authenticated user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Conversation list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversation' }
        '401': { description: Authentication required }
        '403': { description: User does not own this resource }

  /chat/conversations:
    post:
      summary: Create or retrieve a conversation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationCreateRequest' }
      responses:
        '201':
          description: Conversation created or returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { description: At least two participants including the requester are required }
        '401': { description: Authentication required }

  /chat/messages/{conversationId}:
    get:
      summary: Get messages in a conversation
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Embedded message history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }
        '401': { description: Authentication required }
        '404': { description: Conversation not found or access denied }

x-socket-io:
  path: /socket.io/
  authentication:
    handshake:
      auth:
        token: JWT bearer token
  events:
    message:send:
      payload: { $ref: '#/components/schemas/SocketMessageSend' }
      emits: message:received
    message:received:
      payload: { conversationId: string, message: { $ref: '#/components/schemas/Message' } }
    typing:start:
      payload: { conversationId: string }
    typing:stop:
      payload: { conversationId: string }
    read:receipt:
      payload: { conversationId: string, messageId: string }
    chat:error:
      payload: { message: string }

x-rabbitmq:
  exchange: vendora.events
  type: topic
  events:
    chat.offline_message:
      description: Published when the message recipient has no connected socket.
      payload: { conversationId: string, recipientId: integer, message: { $ref: '#/components/schemas/Message' } }
