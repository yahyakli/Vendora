openapi: 3.0.0
info:
  title: Auth Service API
  version: 1.0.0
  description: Microservice for authentication, profile management, and admin user control.

servers:
  - url: /api
    description: API Gateway

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    JwtResponse:
      type: object
      properties:
        token:
          type: string
        refreshToken:
          type: string
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
          nullable: true
        isBanned:
          type: boolean
        enabled:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          enum: [BUYER, SELLER, ADMIN]

    RefreshToken:
      type: object
      properties:
        id:
          type: integer
        token:
          type: string
        expiryDate:
          type: string
          format: date-time

paths:
  # --- Authentication ---
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user and return JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
                rememberMe: { type: boolean }
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JwtResponse' }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: User registered, verification email sent

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify user email with token
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Email verified

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh JWT using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New tokens issued

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user and invalidate tokens
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Logged out

  # --- OAuth2 ---
  /auth/oauth/google:
    get:
      tags: [OAuth2]
      summary: Redirect to Google OAuth2 consent screen
      responses:
        '302':
          description: Redirect to Google

  /auth/oauth/google/callback:
    get:
      tags: [OAuth2]
      summary: Google OAuth2 callback
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Successfully authenticated with Google
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JwtResponse' }

  /auth/oauth/github:
    get:
      tags: [OAuth2]
      summary: Redirect to GitHub OAuth2 consent screen
      responses:
        '302':
          description: Redirect to GitHub

  /auth/oauth/github/callback:
    get:
      tags: [OAuth2]
      summary: GitHub OAuth2 callback
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Successfully authenticated with GitHub
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JwtResponse' }

  # --- User Profile ---
  /users/me:
    get:
      tags: [Profile]
      summary: Get current user profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    put:
      tags: [Profile]
      summary: Update current user profile
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                avatarUrl: { type: string }
      responses:
        '200':
          description: Profile updated

  # --- Admin User Management ---
  /users:
    get:
      tags: [Admin]
      summary: Get all users (Paginated & Filterable)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Search by name or email
        - name: role
          in: query
          schema: { type: string, enum: [BUYER, SELLER, ADMIN] }
        - name: includeDeleted
          in: query
          schema: { type: boolean, default: false }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated list of users

  /users/{id}:
    get:
      tags: [Admin]
      summary: Get user by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    delete:
      tags: [Admin]
      summary: Soft-delete user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: User soft-deleted

  /users/{id}/role:
    put:
      tags: [Admin]
      summary: Update user roles
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: string }
      responses:
        '200':
          description: Roles updated

  /users/{id}/ban:
    put:
      tags: [Admin]
      summary: Ban user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: User banned

  /users/{id}/unban:
    put:
      tags: [Admin]
      summary: Unban user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: User unbanned

  /users/{id}/sessions:
    get:
      tags: [Admin]
      summary: Get active user sessions
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: List of active refresh tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RefreshToken' }
