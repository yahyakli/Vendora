<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify your email</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #eee; border-radius: 10px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #2563eb; margin: 0; }
        .content { background-color: #f8fafc; padding: 30px; border-radius: 8px; text-align: center; }
        .code { font-size: 32px; font-weight: bold; letter-spacing: 5px; color: #1e40af; margin: 20px 0; }
        .footer { text-align: center; margin-top: 30px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Vendora</h1>
        </div>
        <div class="content">
            <p>Hi <span th:text="${name}">User</span>,</p>
            <p>Thanks for joining Vendora! Please use the code below to verify your email address and activate your account.</p>
            <div class="code" th:text="${code}">123456</div>
            <p>This code is valid for 15 minutes.</p>
        </div>
        <div class="footer">
            <p>If you didn't create an account, you can safely ignore this email.</p>
            <p>&copy; 2026 Vendora Marketplace</p>
        </div>
    </div>
</body>
</html>
