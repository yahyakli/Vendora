<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Changed Successfully</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #eee; border-radius: 10px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #2563eb; margin: 0; }
        .content { background-color: #f1f5f9; padding: 30px; border-radius: 8px; text-align: center; }
        .warning { color: #dc2626; font-size: 14px; margin-top: 20px; }
        .footer { text-align: center; margin-top: 30px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Vendora</h1>
        </div>
        <div class="content">
            <p>Hi <span th:text="${name}">User</span>,</p>
            <p>This is a confirmation that the password for your account has been successfully changed.</p>
            <p>If you made this change, you can safely ignore this email.</p>
            <p class="warning"><strong>If you did NOT make this change, please contact our support team immediately or reset your password.</strong></p>
        </div>
        <div class="footer">
            <p>&copy; 2026 Vendora Marketplace</p>
        </div>
    </div>
</body>
</html>
