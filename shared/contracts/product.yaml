openapi: 3.0.0
info:
  title: Vendora Product Service API
  version: 1.0.0
  description: Product Catalog, Category, Vendor Management, Reviews, and Wishlist Service

servers:
  - url: /api
    description: Nginx Gateway API Route

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        parent_id: { type: integer, nullable: true }

    ProductImage:
      type: object
      properties:
        id: { type: integer }
        product_id: { type: integer }
        image_url: { type: string }
        is_primary: { type: boolean }

    Product:
      type: object
      properties:
        id: { type: integer }
        vendor_id: { type: integer }
        category_id: { type: integer }
        subcategory_id: { type: integer, nullable: true }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        short_description: { type: string, nullable: true }
        price: { type: number, format: float }
        compare_at_price: { type: number, format: float, nullable: true }
        cost_price: { type: number, format: float, nullable: true }
        sku: { type: string }
        type: { type: string, enum: [physical, digital] }
        status: { type: string, enum: [draft, pending_approval, active, flagged, inactive] }
        weight: { type: number, nullable: true }
        images:
          type: array
          items: { $ref: '#/components/schemas/ProductImage' }
        category: { $ref: '#/components/schemas/Category' }

    Vendor:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        store_name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        banner_url: { type: string, nullable: true }
        status: { type: string, enum: [pending, approved, suspended, rejected] }
        commission_rate: { type: number }

    Review:
      type: object
      properties:
        id: { type: integer }
        product_id: { type: integer }
        user_id: { type: integer }
        user_name: { type: string, nullable: true }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string, nullable: true }
        comment: { type: string, nullable: true }
        verified_purchase: { type: boolean }

    WishlistItem:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        product_id: { type: integer }
        product: { $ref: '#/components/schemas/Product' }

paths:
  # --- Products ---
  /products:
    get:
      summary: List products with pagination and basic filters
      parameters:
        - name: category_id
          in: query
          schema: { type: integer }
        - name: type
          in: query
          schema: { type: string, enum: [physical, digital] }
        - name: status
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 15 }
      responses:
        '200':
          description: Paginated list of products
    post:
      summary: Create a product (Seller/Admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Product' }
      responses:
        '201':
          description: Product created successfully

  /products/{id}:
    get:
      summary: Get product details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Product details
        '404':
          description: Product not found
    put:
      summary: Update a product (Seller/Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Product' }
      responses:
        '200':
          description: Product updated
    delete:
      summary: Delete a product
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Product deleted

  /products/{id}/images:
    post:
      summary: Upload product image (calls Storage service internally)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image: { type: string, format: binary }
                is_primary: { type: boolean, default: false }
      responses:
        '201':
          description: Image uploaded and associated

  /products/search:
    get:
      summary: Full-text search products with advanced filters
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: category_id
          in: query
          schema: { type: integer }
        - name: min_price
          in: query
          schema: { type: number }
        - name: max_price
          in: query
          schema: { type: number }
        - name: rating
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Search results

  /products/feed:
    get:
      summary: Get personalized product feed (AI-ranked)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Feed product cards

  /products/vendor/{vendorId}:
    get:
      summary: Public vendor storefront product listing
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Products by vendor

  # --- Categories ---
  /categories:
    get:
      summary: List all categories and tree hierarchy
      responses:
        '200':
          description: List of categories
    post:
      summary: Create category (Admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Category' }
      responses:
        '201':
          description: Category created

  /categories/{id}:
    put:
      summary: Update category (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Category updated
    delete:
      summary: Delete category (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Category deleted

  # --- Vendors ---
  /vendors:
    get:
      summary: List active vendors
      responses:
        '200':
          description: Vendors list

  /vendors/{id}:
    get:
      summary: Get vendor profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Vendor profile

  /vendors/apply:
    post:
      summary: Apply to become a vendor
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                store_name: { type: string }
                description: { type: string }
      responses:
        '201':
          description: Vendor application submitted

  /vendors/{id}/approve:
    put:
      summary: Approve vendor application (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Vendor approved

  /vendors/{id}/suspend:
    put:
      summary: Suspend vendor (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Vendor suspended

  # --- Reviews ---
  /products/{id}/reviews:
    get:
      summary: List reviews for a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Reviews list
    post:
      summary: Add review for a product (Buyer)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string }
                comment: { type: string }
      responses:
        '201':
          description: Review created

  # --- Wishlist ---
  /wishlist:
    get:
      summary: Get user wishlist
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User wishlist items

  /wishlist/{productId}:
    post:
      summary: Add product to wishlist
      security: [{ bearerAuth: [] }]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '201':
          description: Added to wishlist
    delete:
      summary: Remove product from wishlist
      security: [{ bearerAuth: [] }]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Removed from wishlist

  # --- Admin Moderation ---
  /products/admin/all:
    get:
      summary: Get all products including drafts & flagged (Admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Moderation product list

  /products/admin/{id}/flag:
    put:
      summary: Flag product for violation (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Product flagged

  /products/admin/{id}/approve:
    put:
      summary: Approve flagged product (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Product approved

