worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone for public API protection
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # Upstreams for microservices and apps
    upstream auth_service    { server auth:8081; }
    upstream product_service { server product:8082; }
    upstream order_service   { server order:8083; }
    upstream chat_service    { server chat:8084; }
    upstream ranking_service { server ai_ranking:8085; }
    upstream storage_service { server storage:8087; }
    upstream analytics_svc   { server analytics:8088; }
    upstream nextjs_app      { server web:3000; }
    upstream react_admin     { server admin:3000; }

    server {
        listen 80;
        server_name localhost;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Auth Service (Auth + User Profile/Admin) ---
        location /api/auth/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://auth_service/api/auth/;
        }

        location /api/users/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://auth_service/api/users/;
        }

        # --- Product Service (Products, Categories, Vendors, Wishlist, Reviews) ---
        location /api/products/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://product_service/api/products/;
        }

        location /api/categories/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://product_service/api/categories/;
        }

        location /api/vendors/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://product_service/api/vendors/;
        }

        location /api/wishlist/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://product_service/api/wishlist/;
        }

        location /api/reviews/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://product_service/api/reviews/;
        }

        # --- Order Service (Orders, Cart, Payouts) ---
        location /api/orders/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://order_service/api/orders/;
        }

        location /api/cart/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://order_service/api/cart/;
        }

        location /api/payouts/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://order_service/api/payouts/;
        }

        # --- Storage Service ---
        location /api/storage/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://storage_service/storage/;
            client_max_body_size 600M;
        }

        # --- Analytics Service ---
        location /api/analytics/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://analytics_svc/api/analytics/;
        }

        # --- Chat Service (REST + Socket.IO WebSockets) ---
        location /api/chat/ {
            proxy_pass http://chat_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /socket.io/ {
            proxy_pass http://chat_service/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- AI Ranking (Internal only - blocked from public gateway access) ---
        location /api/rank/ {
            deny all;
            return 403;
        }

        # --- Admin Dashboard ---
        location /admin/ {
            proxy_pass http://react_admin/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- Buyer / Seller Web App ---
        location / {
            proxy_pass http://nextjs_app/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
