<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Vendora</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #eee; border-radius: 10px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #2563eb; margin: 0; }
        .content { background-color: #f0fdf4; padding: 30px; border-radius: 8px; text-align: center; }
        .cta { display: inline-block; padding: 12px 24px; background-color: #2563eb; color: #fff; text-decoration: none; border-radius: 5px; margin-top: 20px; font-weight: bold; }
        .footer { text-align: center; margin-top: 30px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Vendora</h1>
        </div>
        <div class="content">
            <p>Hi <span th:text="${name}">User</span>,</p>
            <p>Your email has been successfully verified! Your account is now fully active.</p>
            <p>Welcome to the Vendora family. We're excited to have you on board.</p>
            <a href="http://localhost:3000" class="cta">Start Shopping</a>
        </div>
        <div class="footer">
            <p>&copy; 2026 Vendora Marketplace</p>
        </div>
    </div>
</body>
</html>
